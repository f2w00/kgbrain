syntax = "proto3";

package kgbrain.v1;

import "google/protobuf/struct.proto";

option go_package = "kgbrain/internal/gen/kgbrain/v1;kgbrainv1";

// EnrichExtractService 提供信息提取与补全任务的启停与状态查询。
service EnrichExtractService {
  // 启动一个新的提取补全任务。
  rpc StartEnrichExtract(StartEnrichExtractRequest) returns (StartEnrichExtractResponse);
  // 查询指定任务的当前状态与进度。
  rpc GetEnrichExtractJob(GetEnrichExtractJobRequest) returns (GetEnrichExtractJobResponse);
}

// 启动提取补全任务的请求参数。
message StartEnrichExtractRequest {
  // LLM 资源标识，引用已配置的 LLM 资源。
  string llm_resource_id = 1;
  // 数据库资源标识，引用已配置的数据库资源。
  string database_resource_id = 2;
  // 源表名，读取原始数据的表。
  string source_table = 3;
  // 输出表名，写入提取/补全结果的表。
  string output_table = 4;
  // 主键字段名，用于逐行遍历源表。
  string key_field = 5;
  // 输出表字段结构，作为校验、建表和 LLM 输出字段的唯一来源。
  repeated EnrichExtractOutputColumn output_schema = 6;
  // 目标输出结构示例，供 LLM 了解期望的字段格式。
  repeated google.protobuf.Struct target_example = 7;
  // 起始主键值（含），为空则从表头开始。
  optional int64 start_id = 8;
  // 结束主键值（含），为空则直到表尾。
  optional int64 end_id = 9;
  // LLM 请求并发数。
  optional int32 concurrency = 10;
  // 是否覆盖输出表中已有的记录。
  optional bool overwrite = 11;
  // 每页读取的记录数。
  optional int32 page_size = 12;
  // 单行 LLM 调用最大重试次数。
  optional int32 max_retries = 13;
  // 源表中包含待提取 JSON 数据的字段名。为空时默认使用 raw_data。
  optional string source_json_field = 14;
  // 重点字段说明。key 必须是目标字段名，value 描述该字段的抽取/推断规则。
  map<string, string> priority_field_hints = 15;
  // 输出表不存在时是否按 output_schema 自动创建。
  optional bool auto_create_output_table = 16;
}

// 输出表字段定义。
message EnrichExtractOutputColumn {
  // 字段名，不包含 key_field。
  string name = 1;
  // 字段类型，初版仅支持 TEXT 和 BIGINT。
  EnrichExtractOutputColumnType type = 2;
}

// 输出表字段类型。
enum EnrichExtractOutputColumnType {
  // 未指定（默认值），不应使用。
  ENRICH_EXTRACT_OUTPUT_COLUMN_TYPE_UNSPECIFIED = 0;
  // PostgreSQL TEXT。
  ENRICH_EXTRACT_OUTPUT_COLUMN_TYPE_TEXT = 1;
  // PostgreSQL BIGINT。
  ENRICH_EXTRACT_OUTPUT_COLUMN_TYPE_BIGINT = 2;
}

// 启动任务的响应。
message StartEnrichExtractResponse {
  // 任务唯一标识。
  string job_id = 1;
  // 任务初始状态。
  EnrichExtractJobStatus status = 2;
}

// 查询任务状态的请求。
message GetEnrichExtractJobRequest {
  // 任务唯一标识。
  string job_id = 1;
}

// 查询任务状态的响应。
message GetEnrichExtractJobResponse {
  // 任务唯一标识。
  string job_id = 1;
  // LLM 资源标识。
  string llm_resource_id = 2;
  // 数据库资源标识。
  string database_resource_id = 3;
  // 源表名。
  string source_table = 4;
  // 输出表名。
  string output_table = 5;
  // 主键字段名。
  string key_field = 6;
  // 源 JSON 数据字段名。
  string source_json_field = 7;
  // 任务当前状态。
  EnrichExtractJobStatus status = 8;
  // 错误信息，任务失败时提供详细原因。
  string error_message = 9;
  // 最后处理的主键值，可用于断点续传。
  int64 last_key = 10;
  // 已处理的记录总数。
  int64 processed_rows = 11;
  // 成功处理的记录数。
  int64 succeeded_rows = 12;
  // 处理失败的记录数。
  int64 failed_rows = 13;
  // 任务创建时间（Unix 时间戳，秒）。
  int64 created_at_unix = 14;
  // 任务开始执行时间（Unix 时间戳，秒）。
  int64 started_at_unix = 15;
  // 任务完成时间（Unix 时间戳，秒）。
  int64 finished_at_unix = 16;
  // 输出表字段结构。
  repeated EnrichExtractOutputColumn output_schema = 17;
  // 输出表不存在时是否按 output_schema 自动创建。
  bool auto_create_output_table = 18;
}

// 提取补全任务的生命周期状态。
enum EnrichExtractJobStatus {
  // 未指定（默认值），不应使用。
  ENRICH_EXTRACT_JOB_STATUS_UNSPECIFIED = 0;
  // 等待执行。
  ENRICH_EXTRACT_JOB_STATUS_PENDING = 1;
  // 执行中。
  ENRICH_EXTRACT_JOB_STATUS_RUNNING = 2;
  // 执行成功。
  ENRICH_EXTRACT_JOB_STATUS_SUCCEEDED = 3;
  // 部分成功，部分失败。
  ENRICH_EXTRACT_JOB_STATUS_PARTIAL = 4;
  // 执行失败。
  ENRICH_EXTRACT_JOB_STATUS_FAILED = 5;
}
