// 实体对齐服务：将源表中指定字段的值通过 LLM 对齐/标准化到目标值列表。
// 例如将自由文本 "北京" 对齐到标准城市列表中的 "北京市"。

syntax = "proto3";

package kgbrain.v1;

option go_package = "kgbrain/internal/gen/kgbrain/v1;kgbrainv1";

// EntityAlignmentService 提供实体对齐任务的启停与状态查询。
service EntityAlignmentService {
  // 启动一个新的实体对齐任务。
  rpc StartEntityAlignment(StartEntityAlignmentRequest) returns (StartEntityAlignmentResponse);
  // 查询指定任务的当前状态与进度。
  rpc GetEntityAlignmentJob(GetEntityAlignmentJobRequest) returns (GetEntityAlignmentJobResponse);
}

// 启动实体对齐任务的请求参数。
message StartEntityAlignmentRequest {
  // LLM 资源标识。
  string llm_resource_id = 1;
  // 数据库资源标识。
  string database_resource_id = 2;
  // 源表名，包含待对齐的原始数据。
  string source_table = 3;
  // 输出表名，写入对齐结果。
  string output_table = 4;
  // 是否复用已有的映射关系，打开时将先读取已有的映射缓存。
  optional bool reuse_mapping = 5;
  // 需对齐的字段列表，每个字段可配置独立的目标值与批处理参数。
  repeated EntityAlignmentField fields = 6;
  // 主键字段名。
  string key_field = 7;
  // 起始主键值（含）。
  optional int64 start_id = 8;
  // 结束主键值（含）。
  optional int64 end_id = 9;
}

// 单个字段的对齐配置。
message EntityAlignmentField {
  // 源字段名。
  string name = 1;
  // 标准目标值列表，LLM 将源值匹配到这些目标值之一。
  repeated string targets = 2;
  // 批处理大小，每批递交给 LLM 的源值数量。
  optional int32 batch_size = 3;
  // LLM 批处理请求并发数。
  optional int32 batch_concurrency = 4;
}

// 启动任务的响应。
message StartEntityAlignmentResponse {
  // 任务唯一标识。
  string job_id = 1;
  // 任务初始状态。
  EntityAlignmentJobStatus status = 2;
}

// 查询任务状态的请求。
message GetEntityAlignmentJobRequest {
  // 任务唯一标识。
  string job_id = 1;
}

// 查询任务状态的响应。
message GetEntityAlignmentJobResponse {
  // 任务唯一标识。
  string job_id = 1;
  // LLM 资源标识。
  string llm_resource_id = 2;
  // 数据库资源标识。
  string database_resource_id = 3;
  // 源表名。
  string source_table = 4;
  // 输出表名。
  string output_table = 5;
  // 任务当前状态。
  EntityAlignmentJobStatus status = 6;
  // 错误信息，任务失败时提供详细原因。
  string error_message = 7;
  // 任务创建时间（Unix 时间戳，秒）。
  int64 created_at_unix = 8;
  // 任务开始执行时间（Unix 时间戳，秒）。
  int64 started_at_unix = 9;
  // 任务完成时间（Unix 时间戳，秒）。
  int64 finished_at_unix = 10;
}

// 实体对齐任务的生命周期状态。
enum EntityAlignmentJobStatus {
  // 未指定（默认值），不应使用。
  ENTITY_ALIGNMENT_JOB_STATUS_UNSPECIFIED = 0;
  // 等待执行。
  ENTITY_ALIGNMENT_JOB_STATUS_PENDING = 1;
  // 执行中。
  ENTITY_ALIGNMENT_JOB_STATUS_RUNNING = 2;
  // 执行成功。
  ENTITY_ALIGNMENT_JOB_STATUS_SUCCEEDED = 3;
  // 执行失败。
  ENTITY_ALIGNMENT_JOB_STATUS_FAILED = 4;
}
