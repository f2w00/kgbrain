openrpc: "1.3.2"
info:
    title: kgbrain
    version: "1.0.0"
    description: |
        字段映射生成服务。通过一次 LLM 调用推导源字段到目标字段的映射关系, 结果缓存后零成本复用。

servers:
    - name: default
      url: http://localhost:8848/rpc
      description: JSON-RPC 2.0 endpoint

methods:
    - name: profile.set
      summary: 创建或更新用户配置
      description: |
          创建或更新指定 profile_id 的配置。llm 和 notify 为自由格式 JSON, 服务端直接存储不校验内部结构。
      params:
          - name: profile_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 唯一标识
          - name: llm
            schema:
                type: object
            required: true
            description: "LLM 连接配置 (任意 JSON), 推荐字段: base_url, api_key, model, timeout_seconds(默认180秒)"
          - name: notify
            schema:
                type: object
            required: false
            description: 通知渠道配置 (任意 JSON)
      result:
          name: result
          schema:
              $ref: "#/components/schemas/ProfileSetResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: profile.get
      summary: 查询用户配置
      description: 根据 profile_id 获取已保存的配置。
      params:
          - name: profile_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 唯一标识
      result:
          name: result
          schema:
              $ref: "#/components/schemas/ProfileGetResult"
      errors:
          - code: -32004
            message: Profile not found

    - name: profile.delete
      summary: 删除用户配置
      description: 删除指定 profile_id 的配置, 并级联清空关联的映射缓存。
      params:
          - name: profile_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 唯一标识
      result:
          name: result
          schema:
              $ref: "#/components/schemas/ProfileDeleteResult"
      errors:
          - code: -32603
            message: Internal error

    - name: mapping.field
      summary: 生成字段映射关系
      description: |
          根据示例数据推导源字段到目标字段的映射关系。target_fields 中每个字段的 value 会注入 prompt 作为语义示例, 帮助 LLM 理解目标字段期望的取值。一次 LLM 调用后缓存结果 (按字段组合), 相同字段组合再次请求直接从缓存返回。设置 refresh: true 可跳过缓存, 强制重新生成并覆盖旧缓存。
      params:
          - name: profile_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 关联的用户配置
          - name: example
            schema:
                type: object
                minProperties: 1
            required: true
            description: 一条示例数据, key 自动作为源字段
          - name: target_fields
            schema:
                type: array
                items:
                    type: object
                    minProperties: 1
                minItems: 1
                maxItems: 1
            required: true
            description: 目标字段示例, 单个对象, key 为目标字段名 (自动提取为字段列表), value 为示例值 (注入 prompt 辅助 LLM 理解取值语义), 如 [{"name":"李白","dynasty":"唐"}]
          - name: refresh
            schema:
                type: boolean
                default: false
            required: false
            description: 设为 true 时忽略缓存, 强制重新生成
      result:
          name: result
          schema:
              $ref: "#/components/schemas/FieldMappingResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: mapping.content
      summary: 查询并自动补全内容映射
      description: |
          按 topic 查询内容映射表。未命中的值自动调 LLM 映射并缓存。返回该 topic 的完整映射表。
          如果传入 targets 参数，会使用该目标值列表并持久化；如果未传，则从存储中读取该 topic 的目标值。
          如果 targets 未设置且未传入，返回错误。
      params:
          - name: profile_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 关联的用户配置
          - name: topic
            schema:
                type: string
                minLength: 1
            required: true
            description: 映射主题 (如 dynasty, location)
          - name: values
            schema:
                type: array
                items:
                    type: string
                minItems: 1
            required: true
            description: 需要映射的源值列表
          - name: targets
            schema:
                type: array
                items:
                    type: string
                minItems: 1
            required: false
            description: 目标值列表。传入时会使用该列表并持久化；未传时从存储读取
      result:
          name: result
          schema:
              $ref: "#/components/schemas/ContentMappingResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: mapping.content.set
      summary: 设置/更新内容映射表
      description: |
          设置或更新指定 topic 的完整内容映射表。
      params:
          - name: profile_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 关联的用户配置
          - name: topic
            schema:
                type: string
                minLength: 1
            required: true
            description: 映射主题 (如 dynasty, location)
          - name: mapping
            schema:
                type: object
                additionalProperties:
                    type: string
            required: true
            description: "内容映射表 {源值: 目标值}"
      result:
          name: result
          schema:
              $ref: "#/components/schemas/ContentMappingSetResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: mapping.content.targets.set
      summary: 设置内容映射目标值
      description: |
          设置指定 topic 的目标值列表。LLM 映射时会将源值映射到这些目标值之一。
      params:
          - name: profile_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 关联的用户配置
          - name: topic
            schema:
                type: string
                minLength: 1
            required: true
            description: 映射主题 (如 dynasty, location)
          - name: targets
            schema:
                type: array
                items:
                    type: string
                minItems: 1
            required: true
            description: 目标值列表 (如 ["唐", "宋", "明", "清"])
      result:
          name: result
          schema:
              $ref: "#/components/schemas/ContentMappingSetResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: mapping.content.targets.get
      summary: 获取内容映射目标值
      description: |
          获取指定 topic 的目标值列表。
      params:
          - name: profile_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 关联的用户配置
          - name: topic
            schema:
                type: string
                minLength: 1
            required: true
            description: 映射主题 (如 dynasty, location)
      result:
          name: result
          schema:
              $ref: "#/components/schemas/ContentMappingTargetsResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: kgc.enrich
      summary: 数据补全 (KGC Enrich)
      description: |
          一次 LLM 调用完成所有行的数据补全。支持 text 任务（从源字段推断目标字段）和 image 任务（描述图片内容）。
          多模态模型自动处理文本和图片输入。按 profile_id 中的 LLM 配置调用。
      params:
          - name: profile_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 关联的用户配置
          - name: data
            schema:
                type: array
                items:
                    type: object
                maxItems: 100
                minItems: 1
            required: true
            description: 待补全的数据行, 每条数据包含源字段和空的目标字段
          - name: examples
            schema:
                type: array
                items:
                    type: object
            required: false
            description: 示例数据（可选）, 用于指导 LLM 输出格式
          - name: max_image_kb
            schema:
                type: integer
                minimum: 10
                maximum: 5120
                default: 200
            required: false
            description: "图片压缩目标大小(KB), 默认 200。设为 0 不压缩"
          - name: tasks
            schema:
                type: array
                items:
                    type: object
                    properties:
                        source_type:
                            type: string
                            enum: ["text", "image"]
                        source_fields:
                            type: array
                            items:
                                type: string
                            description: "text 任务: 作为源的字段名列表"
                        source_field:
                            type: string
                            description: "image 任务: 图片字段名 (值为 data:image/...;base64,...)"
                        targets:
                            type: array
                            items:
                                type: string
                            minItems: 1
                            description: "目标字段名列表，服务端自动生成 prompt"
                    required: [source_type, targets]
                minItems: 1
            required: true
            description: 补全任务列表, 可同时包含 text 和 image 任务
      result:
          name: result
          schema:
              $ref: "#/components/schemas/KGCEnrichResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: kgc.autofill
      summary: 智能数据转换 (KGC Autofill)
      description: |
          LLM 自主推断源数据到目标结构的映射关系。用户输入源数据 + 目标结构示例，LLM 自行判断如何填充每个目标字段。返回纯目标结构数据。
      params:
          - name: profile_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 关联的用户配置
          - name: data
            schema:
                type: array
                items:
                    type: object
                maxItems: 100
                minItems: 1
            required: true
            description: 源数据行
          - name: targets_example
            schema:
                type: array
                items:
                    type: object
                    minProperties: 1
                minItems: 1
            required: true
            description: 目标结构示例数组，定义输出字段。所有示例必须具有一致的字段集合
      result:
          name: result
          schema:
              $ref: "#/components/schemas/KGCAutofillResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: xform.submit
      summary: 提交异步数据转换任务
      description: |
          创建新的异步数据转换任务。返回 task_id，客户端可通过 append 持续追加数据。
          target_fields 由 targets_example 自动提取，LLM 逐行推断目标字段值。
          可选自定义 task_id，不传时服务端自动生成。
      params:
          - name: task_id
            schema:
                type: string
                maxLength: 64
                pattern: "^[a-zA-Z0-9_-]+$"
            required: false
            description: 可选，自定义任务标识。不传时服务端自动生成。仅允许字母、数字、下划线和连字符
          - name: profile_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 关联的用户配置
          - name: targets_example
            schema:
                type: array
                items:
                    type: object
                    minProperties: 1
                minItems: 1
            required: true
            description: 目标结构示例数组，定义输出字段。所有示例必须具有一致的字段集合
          - name: primary_key
            schema:
                type: string
                minLength: 1
            required: true
            description: 主键字段名，结果中自动保留此字段以便追溯
          - name: pool_size
            schema:
                type: integer
                minimum: 1
                maximum: 100
            required: true
            description: 并发 Worker 数量，控制 LLM 并发调用数
          - name: max_retries
            schema:
                type: integer
                minimum: 0
            required: true
            description: 每行数据最大重试次数
          - name: ttl_hours
            schema:
                type: integer
                minimum: 1
            required: true
            description: 任务存活时间（小时），超时自动关闭
      result:
          name: result
          schema:
              $ref: "#/components/schemas/XformSubmitResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: xform.append
      summary: 追加数据到异步任务
      description: |
          向已创建的任务追加源数据行。每行数据必须包含 primary_key 定义的字段。
      params:
          - name: task_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 任务 ID
          - name: data
            schema:
                type: array
                items:
                    type: object
                minItems: 1
            required: true
            description: 待转换的源数据行
      result:
          name: result
          schema:
              $ref: "#/components/schemas/XformAppendResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: xform.close
      summary: 关闭异步任务
      description: |
          标记任务为 closing 状态，停止接收新数据。Worker 继续处理队列中剩余数据。
      params:
          - name: task_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 任务 ID
      result:
          name: result
          schema:
              $ref: "#/components/schemas/XformCloseResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: xform.get_status
      summary: 查询异步任务状态
      description: 获取任务的当前状态及进度信息。
      params:
          - name: task_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 任务 ID
      result:
          name: result
          schema:
              $ref: "#/components/schemas/XformStatusResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: xform.get_result
      summary: 拉取异步任务结果
      description: |
          拉取已处理的结果。结果拉取后即删除（消费语义），避免重复。
      params:
          - name: task_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 任务 ID
          - name: limit
            schema:
                type: integer
                minimum: 1
                default: 100
            required: false
            description: 单次拉取最大行数
      result:
          name: result
          schema:
              $ref: "#/components/schemas/XformResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

    - name: xform.delete
      summary: 删除异步任务
      description: |
          强制删除任务，清理所有关联资源。Worker 立即停止，所有 Redis Key 被删除。
      params:
          - name: task_id
            schema:
                type: string
                minLength: 1
            required: true
            description: 任务 ID
      result:
          name: result
          schema:
              $ref: "#/components/schemas/XformDeleteResult"
      errors:
          - code: -32602
            message: Invalid params
          - code: -32603
            message: Internal error

components:
    schemas:
        ProfileSetResult:
            type: object
            properties:
                status:
                    type: string
                    enum: ["ok"]
                profile_id:
                    type: string
            required: [status, profile_id]

        ProfileGetResult:
            type: object
            properties:
                profile_id:
                    type: string
                llm_config:
                    type: string
                notify_config:
                    type: string
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
            required: [profile_id, llm_config, created_at, updated_at]

        ProfileDeleteResult:
            type: object
            properties:
                status:
                    type: string
                    enum: ["deleted", "not_found"]
                profile_id:
                    type: string
            required: [status, profile_id]

        FieldMappingResult:
            type: object
            properties:
                mapping:
                    type: object
                    additionalProperties:
                        type: array
                        items:
                            type: string
                    description: 目标字段到源字段的映射
                unmapped_source:
                    type: array
                    items:
                        type: string
                    description: 未映射的源字段
                unfilled_target:
                    type: array
                    items:
                        type: string
                    description: 未填充的目标字段
                cached:
                    type: boolean
                    description: 是否来自缓存
            required: [mapping, unmapped_source, unfilled_target, cached]

        ContentMappingResult:
            type: object
            properties:
                topic:
                    type: string
                    description: 映射主题
                mapping:
                    type: object
                    additionalProperties:
                        type: string
                    description: "完整内容映射表 {源值: 目标值}"
            required: [topic, mapping]

        ContentMappingSetResult:
            type: object
            properties:
                success:
                    type: boolean
                    description: 设置是否成功
            required: [success]

        ContentMappingTargetsResult:
            type: object
            properties:
                topic:
                    type: string
                    description: 映射主题
                targets:
                    type: array
                    items:
                        type: string
                    description: 目标值列表
            required: [topic, targets]

        KGCEnrichResult:
            type: object
            properties:
                data:
                    type: array
                    items:
                        type: object
                    description: 补全后的数据（与原 data 同结构, 目标字段已填充）
                enriched_count:
                    type: integer
                    description: 实际填充的字段总数
            required: [data, enriched_count]

        KGCAutofillResult:
            type: object
            properties:
                data:
                    type: array
                    items:
                        type: object
                    description: 补全后的目标结构数据，无法推断的字段输出 null
            required: [data]

        XformSubmitResult:
            type: object
            properties:
                task_id:
                    type: string
                    description: 任务唯一标识
            required: [task_id]

        XformAppendResult:
            type: object
            properties:
                appended:
                    type: integer
                    description: 成功追加的数据行数
            required: [appended]

        XformCloseResult:
            type: object
            properties:
                status:
                    type: string
                    enum: ["closing"]
                    description: 当前任务状态
            required: [status]

        XformStatusResult:
            type: object
            properties:
                task_id:
                    type: string
                    description: 任务唯一标识
                status:
                    type: string
                    enum: ["open", "processing", "closing", "completed", "failed", "partial", "deleted"]
                    description: 任务状态
                pending_input:
                    type: integer
                    description: Stream 中尚未消费的输入行数
                pending_output:
                    type: integer
                    description: 结果队列中待拉取的行数
                pending_errors:
                    type: integer
                    description: 错误队列中待拉取的行数
            required: [task_id, status, pending_input, pending_output, pending_errors]

        XformErrorEntry:
            type: object
            properties:
                pk_field:
                    type: string
                    description: 主键字段名
                pk_value:
                    description: 主键值
                _error:
                    type: string
                    description: 错误原因
            required: [pk_field, pk_value, _error]

        XformResult:
            type: object
            properties:
                task_id:
                    type: string
                    description: 任务唯一标识
                status:
                    type: string
                    enum: ["open", "processing", "closing", "completed", "failed", "partial", "deleted"]
                    description: 任务状态
                results:
                    type: array
                    items:
                        type: object
                    description: 本次拉取的成功结果列表（消费即删）
                errors:
                    type: array
                    items:
                        $ref: "#/components/schemas/XformErrorEntry"
                    description: 本次拉取的错误信息
                pending_output:
                    type: integer
                    description: 结果队列中剩余行数
                pending_errors:
                    type: integer
                    description: 错误队列中剩余行数
            required: [task_id, status, results, errors, pending_output, pending_errors]

        XformDeleteResult:
            type: object
            properties:
                deleted:
                    type: boolean
                    description: 是否删除成功
            required: [deleted]
