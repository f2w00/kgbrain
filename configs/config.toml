[server]
address      = ":8848"
read_timeout  = "30s"
write_timeout = "60s"

# ---------- 日志 ----------
[log]
level       = "info"
format      = "json"
output      = "stdout"
time_format = "2006-01-02T15:04:05Z0700"

# ---------- 存储 ----------
[store]
path = "data/kgbrain.db"
pragmas = [
    "PRAGMA journal_mode = WAL",
    "PRAGMA synchronous = NORMAL",
    "PRAGMA busy_timeout = 5000",
]

# ---------- Xform ----------
[xform]
redis_url = "redis://10.15.22.91:6379"
redis_password = ""
redis_db = 0
max_error_rate = 0.3
default_ttl_hours = 24
stream_block_ms = 5000
